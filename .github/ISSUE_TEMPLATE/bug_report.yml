name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your `.credentials.json`, a login token, or anything starting with `sk-ant-`.**
        Security problem? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Run `py --version`, or look in Settings → About & stats.
      placeholder: e.g. Python 3.14.6
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pet version
      description: Shown in the pet's Settings → About & stats.
      placeholder: e.g. 7.33
  - type: input
    id: screens
    attributes:
      label: Monitors and display scaling
      description: How many monitors, and their scaling (Windows Settings → System → Display).
      placeholder: e.g. one laptop screen at 150%
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: The relevant part of `data/pet_errors.log` in the pet's folder, if there is one. It never contains your login token.
      render: text
